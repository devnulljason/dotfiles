import:
  - ~/.config/alacritty/dracula.yml
window:
  dimensions:
    columns: 90
    lines: 35
  position:
    x: 0
    y: 0
  title: Alacritty
  dynamic_title: true
  class:
    instance: Alacritty
    general: Alacritty
scrolling:
  history: 10000
  multiplier: 3
font:
  normal:
    family: SauceCodePro NF
selection:
  semantic_escape_chars: ",│`|:\"' ()[]{}<>\t"
  save_to_clipboard: true
cursor:
  style: Beam
  vi_mode_style: Block
