window:
  dimensions:
    columns: 90
    lines: 35
  position:
    x: 0
    y: 0
  title: Alacritty
  dynamic_title: true
  class:
    instance: Alacritty
    general: Alacritty
scrolling:
  history: 10000
  multiplier: 3
font:
  normal:
    family: Hasklig
    style: Regular
  bold:
    family: Hasklig
    style: Bold
  italic:
    family: Hasklig
    style: Italic
  bold_italic:
    family: Hasklig
    style: Bold Italic
  size: 8.0
selection:
  semantic_escape_chars: ",│`|:\"' ()[]{}<>\t"
  save_to_clipboard: true
cursor:
  style: Block
  vi_mode_style: Beam
